name: tests

on:
  push:
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shellcheck
        run: shellcheck -S warning fantasy_manager.sh tests/run.sh tests/parity.sh tests/make_expected.sh
      - name: Offline test suite
        run: bash tests/run.sh
      - name: PowerShell parity (pwsh on Linux vs bash, every fixture)
        run: bash tests/parity.sh
      - name: Expected reports for the Windows job
        run: bash tests/make_expected.sh expected
      - uses: actions/upload-artifact@v4
        with:
          name: expected-reports
          path: expected/

  windows:
    needs: offline-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: expected-reports
          path: expected
      - name: Windows PowerShell 5.1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows.ps1 -Expected expected
      - name: PowerShell 7
        shell: cmd
        run: pwsh -NoProfile -File tests\windows.ps1 -Expected expected

  package:
    # The Windows download (the app plus its own Python), built and run with
    # no other Python reachable. A release attaches the same zip.
    needs: offline-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows download
        shell: powershell
        run: ./tools/package.ps1
      - name: Run it without any other Python
        shell: powershell
        run: ./tools/check_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FantasyManager-windows
          path: dist/FantasyManager-*-windows.zip
